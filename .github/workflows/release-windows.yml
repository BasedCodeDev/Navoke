name: Release Windows installer

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Validate release tag
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expectedTag."
          }

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npm run prepare:browser:win

      - name: Test
        run: npm test

      - name: Build Windows installer
        run: npm run package:win

      - name: Verify generated plugin files are current
        shell: pwsh
        run: git diff --exit-code -- plugins/navoke-chatgpt/dist/index.js plugins/navoke-hunyuan/dist/index.js plugins/navoke-model-renderer/dist/index.js

      - name: Install and smoke test packaged app
        id: package
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem release -Filter 'Navoke-Setup-*-x64.exe')
          if ($installer.Count -ne 1) {
            throw "Expected exactly one x64 installer, found $($installer.Count)."
          }

          $installDir = Join-Path $env:RUNNER_TEMP 'NavokeInstall'
          $process = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Installer exited with code $($process.ExitCode)."
          }

          $executable = Join-Path $installDir 'Navoke.exe'
          $requiredPaths = @(
            $executable,
            (Join-Path $installDir 'resources\extension\manifest.json'),
            (Join-Path $installDir 'resources\plugins\navoke-chatgpt\plugin.json'),
            (Join-Path $installDir 'resources\plugins\navoke-hunyuan\plugin.json'),
            (Join-Path $installDir 'resources\plugins\navoke-model-renderer\plugin.json'),
            (Join-Path $installDir 'resources\playwright-browsers')
          )
          foreach ($requiredPath in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $requiredPath)) {
              throw "Packaged resource not found: $requiredPath"
            }
          }

          node scripts/smoke-windows-package.cjs $executable

          $checksumPath = "$($installer[0].FullName).sha256"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer[0].FullName).Hash.ToLowerInvariant()
          "$hash  $($installer[0].Name)" | Set-Content -LiteralPath $checksumPath -Encoding ascii
          "installer=$($installer[0].FullName)" >> $env:GITHUB_OUTPUT
          "checksum=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: navoke-windows-${{ github.ref_name }}
          path: |
            ${{ steps.package.outputs.installer }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER: ${{ steps.package.outputs.installer }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:INSTALLER $env:CHECKSUM --clobber
          } else {
            gh release create $tag $env:INSTALLER $env:CHECKSUM --draft --generate-notes --title "Navoke $tag" --notes "Unsigned Windows prerelease. Windows SmartScreen may request confirmation before installation."
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create or update release $tag."
          }
